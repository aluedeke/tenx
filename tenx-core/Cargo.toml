# Pure logic shared by the `tenx` binary and (later) the native client: task
# status resolution, slugging, durations, sweep rules, TASK.md rendering.
# Deliberately no `std::process::Command`, no filesystem access beyond what a
# caller hands in as data — everything here is unit-testable with fixtures and
# compiles for any target.
[package]
name = "tenx-core"
version = "0.3.2"
edition = "2024"
rust-version = "1.87"
description = "Pure, side-effect-free logic shared by the tenx CLI and its front ends: task status, slugs, sweep rules, TASK.md rendering"
license = "MIT OR Apache-2.0"
repository = "https://github.com/aluedeke/tenx"
keywords = ["tmux", "git-worktree", "claude-code", "workspace"]
categories = ["development-tools"]

# A library: nothing for cargo-dist to package. The `tenx` binary comes from
# the `tenx-cli` package at the workspace root.
[package.metadata.dist]
dist = false

[dependencies]
serde = { version = "1", features = ["derive"] }
# preserve_order + float_roundtrip: `trust` rewrites Claude Code's own
# ~/.claude.json, and the rewrite must be a one-entry diff — same key order,
# every float parsed exactly so it prints back as it was.
serde_json = { version = "1", features = ["preserve_order", "float_roundtrip"] }
# `webpush`: Web Push message encryption (RFC 8291) and VAPID (RFC 8292),
# pure Rust so the musl builds need no OpenSSL. Randomness comes from the
# caller, so everything here stays deterministic and testable.
p256 = { version = "0.13", default-features = false, features = ["ecdh", "ecdsa", "arithmetic", "std"] }
hkdf = "0.12"
sha2 = "0.10"
aes-gcm = { version = "0.10", default-features = false, features = ["aes", "alloc"] }
base64 = "0.22"
