# Cut a release from the Actions tab (or `gh workflow run bump.yml -f bump=minor`):
# `auto` derives the version from the commits since the last tag (git-cliff),
# or pick patch, minor or major; the version itself is never typed. The
# CHANGELOG section is generated from the same commits (scripts/release.sh). This pushes the `release vX.Y.Z` commit to
# main and dispatches release.yml (generated by cargo-dist), which builds the
# binaries, publishes the GitHub Release and Homebrew formula, and creates the
# tag. `gh workflow run` with GITHUB_TOKEN is allowed to start workflows; a
# plain tag push from a workflow would not be.
name: bump

on:
  workflow_dispatch:
    inputs:
      bump:
        description: Which part of the version to bump
        required: true
        default: auto
        type: choice
        options: [auto, patch, minor, major]
      dry-run:
        description: Only print the version that would be cut
        required: false
        default: false
        type: boolean

permissions:
  contents: write
  actions: write

jobs:
  bump:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          fetch-tags: true
      - uses: dtolnay/rust-toolchain@stable
      - name: Install dist
        run: curl --proto '=https' --tlsv1.2 -LsSf https://github.com/axodotdev/cargo-dist/releases/download/v0.32.0/cargo-dist-installer.sh | sh
      - name: Install git-cliff
        uses: taiki-e/install-action@v2
        with:
          tool: git-cliff@2.14.1
      - name: Git identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
      - name: Bump, commit, push, dispatch release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "${{ inputs.dry-run }}" = "true" ]; then
            ./scripts/release.sh "${{ inputs.bump }}" --dry-run
          else
            ./scripts/release.sh "${{ inputs.bump }}" --push
          fi
