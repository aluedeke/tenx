# Publishes the Homebrew formula to aluedeke/homebrew-tap. Called by
# release.yml (generated by cargo-dist) as a custom publish job, in place of
# dist's built-in one: that one reads the tap token from a GitHub secret,
# whereas this one decrypts it from secrets/ci.enc.env with sops, so the repo
# is the only place the token lives. The single GitHub secret is SOPS_AGE_KEY,
# the private key of the CI recipient listed in .sops.yaml.
name: publish-homebrew

on:
  workflow_call:
    inputs:
      plan:
        description: The dist plan (dist-manifest.json), passed by release.yml
        required: true
        type: string

permissions:
  contents: read

env:
  SOPS_VERSION: 3.13.2
  SOPS_SHA256: 154dfe4cd70554bdd82b98e4cd4acf191d43d01ead6f00a73477aa44c4ac42ef
  TAP: aluedeke/homebrew-tap

jobs:
  publish:
    runs-on: ubuntu-24.04
    env:
      PLAN: ${{ inputs.plan }}
    steps:
      # This repo, for .sops.yaml and secrets/ci.enc.env.
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      # The formula dist built (Formula/<name>.rb), alongside the other artifacts.
      - uses: actions/download-artifact@v8
        with:
          pattern: artifacts-*
          path: artifacts/
          merge-multiple: true

      - name: Install sops
        run: |
          curl -sSfL -o sops "https://github.com/getsops/sops/releases/download/v${SOPS_VERSION}/sops-v${SOPS_VERSION}.linux.amd64"
          echo "${SOPS_SHA256}  sops" | sha256sum -c -
          chmod +x sops && sudo mv sops /usr/local/bin/sops
          sops --version

      - name: Push formula to the tap
        env:
          SOPS_AGE_KEY: ${{ secrets.SOPS_AGE_KEY }}
        run: |
          set -euo pipefail
          token=$(sops -d --extract '["HOMEBREW_TAP_TOKEN"]' secrets/ci.enc.env)
          echo "::add-mask::${token}"
          # Basic auth header per command, so the token never lands in a
          # .git/config on the runner.
          auth="AUTHORIZATION: basic $(printf 'x-access-token:%s' "${token}" | base64 -w0)"
          unset token
          git -c "http.https://github.com/.extraheader=${auth}" clone --depth 1 "https://github.com/${TAP}.git" tap
          cd tap
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          mkdir -p Formula
          # Same selection dist's own job makes: every release with a *.rb artifact.
          for release in $(echo "$PLAN" | jq --compact-output '.releases[] | select([.artifacts[] | endswith(".rb")] | any)'); do
            filename=$(echo "$release" | jq --raw-output '.artifacts[] | select(endswith(".rb"))')
            name=${filename%.rb}
            version=$(echo "$release" | jq --raw-output .app_version)
            cp "../artifacts/${filename}" "Formula/${filename}"
            git add "Formula/${filename}"
            git commit -m "${name} ${version}"
          done
          git -c "http.https://github.com/.extraheader=${auth}" push origin HEAD:main
