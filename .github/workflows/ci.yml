name: ci

on:
  push:
  pull_request:

jobs:
  # Every commit message must be a Conventional Commit (scripts/check-commit-msg.sh):
  # the subject becomes the changelog and the type decides the version bump.
  commits:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Check commit messages
        run: |
          if [ "${{ github.event_name }}" = pull_request ]; then
            range="${{ github.event.pull_request.base.sha }}..${{ github.event.pull_request.head.sha }}"
          elif [ "${{ github.event.before }}" != "0000000000000000000000000000000000000000" ]; then
            range="${{ github.event.before }}..${{ github.sha }}"
          else
            range="${{ github.sha }}~1..${{ github.sha }}"
          fi
          ./scripts/check-commit-msg.sh --range "$range"

  test:
    strategy:
      fail-fast: false
      matrix:
        # Pinned images, not *-latest: the image decides the tmux the e2e test
        # drives (apt's on Ubuntu), so it moves only when we move it — like
        # the Rust version in rust-toolchain.toml. GitHub retires images
        # after ~2 years; bump then.
        os: [ubuntu-24.04, macos-26]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
      # The version pinned in rust-toolchain.toml, with its components.
      - name: Install Rust
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      # The e2e test drives a throwaway tmux server (tests/e2e_tmux.rs).
      - name: Install tmux
        run: |
          if command -v apt-get >/dev/null; then sudo apt-get update -q && sudo apt-get install -y -q tmux; fi
          if command -v brew >/dev/null; then brew install tmux; fi
          tmux -V
      - name: Build
        run: cargo build --workspace
      - name: Test
        run: cargo test --workspace
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
