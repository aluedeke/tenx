name: ci

on:
  push:
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      # The e2e test drives a throwaway tmux server (tests/e2e_tmux.rs).
      - name: Install tmux
        run: |
          if command -v apt-get >/dev/null; then sudo apt-get update -q && sudo apt-get install -y -q tmux; fi
          if command -v brew >/dev/null; then brew install tmux; fi
          tmux -V
      - name: Build
        run: cargo build --workspace
      - name: Test
        run: cargo test --workspace
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
