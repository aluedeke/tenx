# Builds tenx.app for Apple silicon, signed with the maintainer's Developer ID,
# for `tenx web service` to run (src/web/service.rs, rule in
# tenx_core::service::service_program). Called by release.yml (generated by
# cargo-dist) as a custom local-artifacts job, beside dist's own builds.
#
# Why an app: macOS keeps a privacy permission (iCloud Drive, which a
# workspace may live in) for an app under its bundle id, but for a bare binary
# under its path too, and Homebrew's Cellar path changes with every version —
# so a LaunchAgent running the plain binary asks again after each upgrade
# (tested: a signed bare binary in a new folder asked again; a signed bundle
# in a new folder didn't).
#
# The archive it uploads (artifacts-tenx-app) reaches the GitHub Release with
# dist's files; publish-homebrew.yml adds it to the formula. The certificate
# comes from secrets/ci.enc.env (MACOS_CODESIGN_P12, base64 .p12, and
# MACOS_CODESIGN_P12_PASSWORD; scripts/macos-codesign-secret.sh puts them
# there), decrypted with sops — SOPS_AGE_KEY is the one GitHub secret.
name: build-macos-app

on:
  workflow_call:
    inputs:
      plan:
        description: The dist plan (dist-manifest.json), passed by release.yml
        required: true
        type: string

permissions:
  contents: read

env:
  SOPS_VERSION: 3.13.2
  SOPS_SHA256: 412c475b52f167f1facd75d564422ffd1fa5302aaa7a404bdf4e30087e04b5a8
  TARGET: aarch64-apple-darwin
  BUNDLE_ID: io.github.aluedeke.tenx
  # Apple's "Developer ID Certification Authority" G2, valid until 2031-09-17.
  DEVELOPER_ID_G2_SHA256: f16cd3c54c7f83cea4bf1a3e6a0819c8aaa8e4a1528fd144715f350643d2df3a

jobs:
  build:
    # The runner dist builds Apple silicon on (dist-workspace.toml).
    runs-on: macos-26
    env:
      PLAN: ${{ inputs.plan }}
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      # As .github/build-setup.yml does for dist's builds: build.rs embeds
      # web/out, or a "run make web" stub.
      - name: Install Node
        uses: actions/setup-node@v5
        with:
          node-version-file: web/.nvmrc
      - name: Build the web page
        run: |
          corepack enable
          cd web
          pnpm install --frozen-lockfile
          pnpm build

      # The profile and target dist builds with; rust-toolchain.toml picks Rust.
      - name: Build
        run: cargo build --locked --profile dist --target "$TARGET" --bin tenx --bin tenx-whisper --bin tenx-tts

      - name: Assemble tenx.app
        run: |
          set -euo pipefail
          version=$(echo "$PLAN" | jq -r '.releases[] | select(.app_name == "tenx-cli") | .app_version')
          app=tenx.app/Contents
          mkdir -p "$app/MacOS"
          cp "target/$TARGET/dist/"{tenx,tenx-whisper,tenx-tts} "$app/MacOS/"
          # LSUIElement: no Dock icon; it's a background program.
          cat > "$app/Info.plist" <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>CFBundleIdentifier</key><string>${BUNDLE_ID}</string>
            <key>CFBundleName</key><string>tenx</string>
            <key>CFBundleExecutable</key><string>tenx</string>
            <key>CFBundlePackageType</key><string>APPL</string>
            <key>CFBundleShortVersionString</key><string>${version}</string>
            <key>CFBundleVersion</key><string>${version}</string>
            <key>LSUIElement</key><true/>
          </dict>
          </plist>
          EOF
          plutil -lint "$app/Info.plist"

      - name: Install sops
        run: |
          curl -sSfL -o sops "https://github.com/getsops/sops/releases/download/v${SOPS_VERSION}/sops-v${SOPS_VERSION}.darwin.arm64"
          echo "${SOPS_SHA256}  sops" | shasum -a 256 -c -
          chmod +x sops && sudo mv sops /usr/local/bin/sops
          sops --version

      # A keychain of the job's own, with a random password, so codesign can
      # use the key without a prompt (the partition list), and the runner's
      # login keychain is never touched.
      - name: Sign
        env:
          SOPS_AGE_KEY: ${{ secrets.SOPS_AGE_KEY }}
        run: |
          set -euo pipefail
          p12="${RUNNER_TEMP}/codesign.p12"
          keychain="${RUNNER_TEMP}/codesign.keychain-db"
          # However the step ends: no identity left on disk or in a keychain.
          trap 'rm -f "$p12"; security delete-keychain "$keychain" 2>/dev/null || true' EXIT
          (umask 077 && sops -d --extract '["MACOS_CODESIGN_P12"]' secrets/ci.enc.env | base64 -d > "$p12")
          p12_password=$(sops -d --extract '["MACOS_CODESIGN_P12_PASSWORD"]' secrets/ci.enc.env)
          keychain_password=$(openssl rand -hex 24)
          security create-keychain -p "$keychain_password" "$keychain"
          security set-keychain-settings -lut 3600 "$keychain"
          security unlock-keychain -p "$keychain_password" "$keychain"
          security import "$p12" -k "$keychain" -P "$p12_password" -T /usr/bin/codesign
          # The intermediate between the certificate and Apple's root: the
          # .p12 holds the leaf only, and a fresh runner may not have it.
          curl -sSfL -o "${RUNNER_TEMP}/g2.cer" https://www.apple.com/certificateauthority/DeveloperIDG2CA.cer
          echo "${DEVELOPER_ID_G2_SHA256}  ${RUNNER_TEMP}/g2.cer" | shasum -a 256 -c -
          security import "${RUNNER_TEMP}/g2.cer" -k "$keychain"
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$keychain_password" "$keychain" > /dev/null
          security list-keychains -d user -s "$keychain" $(security list-keychains -d user | tr -d '"')
          rm -f "$p12"
          identity=$(security find-identity -v -p codesigning "$keychain" | awk '/Developer ID Application/ {print $2; exit}')
          test -n "$identity"
          # The helpers first, then the bundle, which signs its main program.
          for helper in tenx-whisper tenx-tts; do
            codesign --force --timestamp --sign "$identity" --keychain "$keychain" \
              --identifier "${BUNDLE_ID}.${helper#tenx-}" tenx.app/Contents/MacOS/$helper
          done
          codesign --force --timestamp --sign "$identity" --keychain "$keychain" tenx.app
          codesign --verify --strict --deep --verbose=2 tenx.app
          codesign -d -r- tenx.app

      - name: Package
        run: |
          set -euo pipefail
          # COPYFILE_DISABLE: no AppleDouble ._ files in the archive.
          COPYFILE_DISABLE=1 tar -cJf "tenx-app-${TARGET}.tar.xz" tenx.app
          shasum -a 256 "tenx-app-${TARGET}.tar.xz" | tee "tenx-app-${TARGET}.tar.xz.sha256"

      # artifacts-*: the name dist's host and release steps collect.
      - uses: actions/upload-artifact@v7
        with:
          name: artifacts-tenx-app
          path: |
            tenx-app-${{ env.TARGET }}.tar.xz
            tenx-app-${{ env.TARGET }}.tar.xz.sha256
