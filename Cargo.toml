# Root package + workspace: `tenx` is the native CLI/TUI binary; `tenx-zellij`
# (the Ctrl+w overlay) and `tenx-statusbar` (the per-tab status line) are WASM
# zellij plugins (build with --target wasm32-wasip1).
[workspace]
members = ["tenx-zellij", "tenx-statusbar"]

[package]
name = "tenx"
version = "0.1.0"
edition = "2024"

[dependencies]
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
toml = "0.8"
ratatui = "0.29"
crossterm = "0.28"
anyhow = "1"
thiserror = "2"
serde_json = "1"
libc = "0.2.189"
# Pinned to what ratatui 0.29 itself depends on, so cursor-column math done by
# hand (see `render_list`'s real terminal cursor) uses the identical width
# table ratatui's own Buffer rendering does — a mismatched table is exactly
# the off-by-one-column bug `tenx-statusbar`'s CLAUDE.md notes already hit.
unicode-width = "=0.2.0"
