# Root package + workspace: `tenx` is the CLI/TUI binary (the overlay, the
# watcher, every command); `tenx-core` is the pure logic it and any future
# front end share. tmux is the session layer — see ARCHITECTURE.md.
[workspace]
members = ["tenx-core"]

[package]
name = "tenx"
version = "0.1.0"
edition = "2024"
rust-version = "1.87"
description = "Work on many tasks in parallel, each with its own git worktrees and its own Claude Code agent, and always know which one needs you"
license = "MIT OR Apache-2.0"
repository = "https://github.com/aluedeke/tenx"
readme = "README.md"
keywords = ["tmux", "git-worktree", "tui", "claude-code", "workspace"]
categories = ["command-line-utilities", "development-tools"]

[dependencies]
tenx-core = { path = "tenx-core" }
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
toml = "0.8"
ratatui = "0.29"
crossterm = "0.28"
anyhow = "1"
thiserror = "2"
serde_json = "1"
libc = "0.2.189"
# Pinned to what ratatui 0.29 itself depends on, so cursor-column math done by
# hand (see `render_list`'s real terminal cursor) uses the identical width
# table ratatui's own Buffer rendering does — a mismatched table is exactly
# the off-by-one-column bug `tenx-statusbar`'s CLAUDE.md notes already hit.
unicode-width = "=0.2.0"

[dev-dependencies]
serde_json = "1"
