# Root package + workspace: `tenx` is the native CLI/TUI binary; `tenx-zellij`
# is the WASM launcher plugin (build with --target wasm32-wasip1).
[workspace]
members = ["tenx-zellij"]

[package]
name = "tenx"
version = "0.1.0"
edition = "2024"

[dependencies]
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
toml = "0.8"
ratatui = "0.29"
crossterm = "0.28"
anyhow = "1"
thiserror = "2"
serde_json = "1"
