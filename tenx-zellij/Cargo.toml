[package]
name = "tenx-zellij"
version = "0.1.0"
edition = "2021"

# WASM zellij plugin: the tenx task overlay, rendered natively as a plugin pane.
#
# Why a plugin (not the old floating-terminal launcher): zellij runs ONE plugin
# instance per (plugin, client) and `LaunchOrFocusPlugin { move_to_focused_tab }`
# keeps a single session-wide pane that travels to whoever summons it — so there
# is exactly one overlay, correctly attributed to the summoning client, with no
# pane tracking to get out of sync. The plugin sandbox can't read the filesystem,
# so task data comes from `tenx overlay --json` via run_command, and jumps use
# the plugin host API (go_to_tab_name) or `tenx task open` for closed tasks.

[dependencies]
zellij-tile = "0.44"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Render the overlay UI with ratatui, targeting an in-memory Buffer that we
# serialize to ANSI for the plugin's render output. default-features=false
# drops the crossterm backend (which can't build for wasm32-wasip1) — we never
# touch a real terminal, only ratatui's widget/layout/Buffer core.
ratatui = { version = "0.29", default-features = false }
